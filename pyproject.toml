[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circle"
version = "0.3.1"
description = "A terminal coding agent for your own model endpoint"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/qingshanfeihu/circle"
Documentation = "https://github.com/qingshanfeihu/circle/blob/main/docs/index.md"
Issues = "https://github.com/qingshanfeihu/circle/issues"
Changelog = "https://github.com/qingshanfeihu/circle/blob/main/CHANGELOG.md"

[project.scripts]
circle = "circle.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["circle*"]
exclude = ["tests*", "packaging*"]

[tool.setuptools.package-data]
circle = ["prompts/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
