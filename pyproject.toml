[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circle"
version = "0.1.0"
description = "Circle — compile harness with a zero-Python install path"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["dependencies"]

[project.scripts]
circle = "circle.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["circle*"]
exclude = ["tests*", "packaging*"]

[tool.setuptools.package-data]
circle = ["prompts/**/*.md", "node/*.mjs", "node/*.json"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.15,<1"]
google = ["langchain-google-genai>=4,<5"]
aws = ["langchain-aws>=1,<2"]
ollama = ["langchain-ollama>=1,<2"]
lsp = ["multilspy>=0.0.15,<1"]
images = ["Pillow>=12,<14"]
acp = ["agent-client-protocol>=0.10.1,<1", "deepagents-acp==0.0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
