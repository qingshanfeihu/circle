name: release

# Push a tag vX.Y.Z and this builds Circle on every platform, smoke-tests what it built, and
# publishes one GitHub Release. Steps to cut one: docs/development/releasing.md.
#
# Run it by hand (Actions > release > Run workflow) to build and smoke every platform without
# publishing anything, even when you pick a tag as the ref. Do that before the first tag, and after
# you change this file or the spec.

on:
  push:
    branches: [main, "release/**"]
    tags:
      - "v*"
  workflow_dispatch:

env:
  PIP_DEFAULT_TIMEOUT: "60"
  PIP_RETRIES: "5"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, os: linux, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, os: linux, arch: arm64 }
          - { runner: macos-15-intel, os: darwin, arch: x86_64 }
          - { runner: macos-15, os: darwin, arch: arm64 }
          - { runner: windows-2025, os: windows, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag, version files and changelog agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/release.py --check "${GITHUB_REF_NAME#v}"

      - name: Prepare isolated build environment
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          python - <<'PYTHON'
          import os, platform, venv
          from pathlib import Path
          actual = platform.machine().lower()
          actual = {'amd64': 'x86_64', 'aarch64': 'arm64'}.get(actual, actual)
          assert actual == os.environ['EXPECTED_ARCH'], actual
          root = Path(os.environ['RUNNER_TEMP']) / 'circle-build'
          venv.create(root, with_pip=True)
          scripts = root / ('Scripts' if os.name == 'nt' else 'bin')
          with open(os.environ['GITHUB_PATH'], 'a') as path:
              path.write(str(scripts) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('CIRCLE_HOME=' + str(Path(os.environ['RUNNER_TEMP']) / 'circle-home') + '\n')
              env.write('PYTHONUTF8=1\n')
          PYTHON

      - name: Install
        timeout-minutes: 15
        run: |
          python -m pip install -U pip setuptools==79.0.1 wheel
          python -m pip install -e '.[dev]' pyinstaller==6.22.3
          python scripts/release.py --check "$(python -c 'from circle import __version__; print(__version__)')"

      - name: Tests
        run: python -m pytest -q

      - name: Freeze
        run: pyinstaller packaging/circle.spec --noconfirm --clean

      - name: Smoke the frozen program
        run: python scripts/smoke_frozen.py dist/circle

      - name: Pack and verify installed archive
        run: |
          python scripts/pack_release.py ${{ matrix.os }} ${{ matrix.arch }}
          python scripts/smoke_install.py ${{ matrix.os }} ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: circle-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            circle-${{ matrix.os }}-${{ matrix.arch }}.*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Checksums
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/verify_release.py dist-release "$GITHUB_SHA" "${GITHUB_REF_NAME#v}"
          for asset in circle-linux-x86_64.tar.gz circle-linux-arm64.tar.gz circle-darwin-x86_64.tar.gz circle-darwin-arm64.tar.gz circle-windows-x86_64.zip; do
            test -s "dist-release/$asset"
            test -s "dist-release/$asset.sha256"
          done
          cp install.sh install.ps1 dist-release/
          cd dist-release
          sha256sum --check circle-*.sha256
          sha256sum circle-*.tar.gz circle-*.zip install.sh install.ps1 > SHA256SUMS
          ls -l

      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            python scripts/release.py --notes "$VERSION"
            echo
            sed -e "s/@VERSION@/${VERSION}/g" -e "s|@REPO@|${GITHUB_REPOSITORY}|g" \
                -e "s|@TAG@|${GITHUB_REF_NAME}|g" .github/release-install.md
          } > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > existing-release.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("existing-release.json"))["isDraft"], "refusing to overwrite a published release"'
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Circle ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist-release/* --clobber
          gh release view "$GITHUB_REF_NAME" --json assets > release-assets.json
          python - <<'PYTHON'
          import json
          from pathlib import Path
          expected = {p.name: p.stat().st_size for p in Path('dist-release').iterdir() if p.is_file()}
          actual = {a['name']: a['size'] for a in json.loads(Path('release-assets.json').read_text())['assets']}
          assert actual == expected, (actual, expected)
          PYTHON
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file notes.md
