name: release

# Every push to main builds the runtime-inclusive package on six targets and smoke-tests it:
# install, relocation, upgrade, checksum rejection, the default location, a real tool turn.
# It also packages the desktop application on four targets and runs each package; on Windows it
# also builds the MSI, installs it and removes it again.
# A pull request runs it only when it changes how Circle is packaged or installed; the Check
# workflow builds and smoke-tests the Linux package for every other one, and the Desktop
# workbench workflow packages the desktop application.
# Push a tag vX.Y.Z and the same run publishes one GitHub Release once every target passed.
# Steps to cut one: docs/development/releasing.md. A manual run never publishes.

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    # ready_for_review: a draft runs nothing, and marking it ready runs the workflow
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'src/install_*.ts'
      - 'src/update.ts'
      - 'src/version.ts'
      - 'scripts/build-release.ts'
      - 'scripts/smoke-release.ts'
      - 'scripts/release.ts'
      - 'scripts/node-runtime.json'
      - 'scripts/copy-assets.ts'
      - 'tsconfig.build.json'
      - 'package.json'
      - 'package-lock.json'
      # Not apps/desktop/package.json: most changes there only list a new test, and Desktop
      # workbench packages the application for every pull request that touches apps/
      - 'apps/desktop/scripts/**'
      - 'apps/desktop/package-lock.json'
      - '.github/release-install.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces the run of the older one. A run on main or a tag finishes:
# releasing needs the release workflow to have passed on main, and only main and tags build macOS.
# The newest waiting run replaces older waiting ones.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # A draft pull request runs nothing
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # A pull request leaves out the two macOS targets, which main and every tag still build.
        # The organization runs five macOS jobs at a time, shared with main and releases.
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '[
          {"runner": "ubuntu-24.04", "target": "linux-x64"},
          {"runner": "ubuntu-24.04-arm", "target": "linux-arm64"},
          {"runner": "windows-2025", "target": "windows-x64"},
          {"runner": "windows-11-arm", "target": "windows-arm64"}
          ]' || '[
          {"runner": "ubuntu-24.04", "target": "linux-x64"},
          {"runner": "ubuntu-24.04-arm", "target": "linux-arm64"},
          {"runner": "macos-15-intel", "target": "darwin-x64"},
          {"runner": "macos-15", "target": "darwin-arm64"},
          {"runner": "windows-2025", "target": "windows-x64"},
          {"runner": "windows-11-arm", "target": "windows-arm64"}
          ]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Tag, version files and changelog agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm run -s release -- --check "${GITHUB_REF_NAME#v}"
      - run: npm run check
      - run: npm run format:check
      - run: npm run release:build
      - run: npm run release:smoke
      - uses: actions/upload-artifact@v7
        with:
          name: circle-${{ matrix.target }}
          path: .tmp/release/*
          if-no-files-found: error
          retention-days: 3

  # The desktop application, built and run as a user gets it: a signed-ad-hoc .dmg on macOS,
  # an .msi on Windows, a .tar.gz on Linux, each started from the package before it is
  # published. The MSI holds the packaged folder; it is installed and removed here.
  desktop:
    name: desktop (${{ matrix.target }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # A pull request leaves out the two macOS targets, as build does
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '[
          {"runner": "windows-2025", "target": "windows-x64", "app": "Circle-win32-x64", "executable": "Circle-win32-x64/Circle.exe"},
          {"runner": "ubuntu-24.04", "target": "linux-x64", "app": "Circle-linux-x64", "executable": "Circle-linux-x64/Circle"}
          ]' || '[
          {"runner": "macos-15", "target": "darwin-arm64", "app": "Circle-darwin-arm64/Circle.app", "executable": "Circle-darwin-arm64/Circle.app/Contents/MacOS/Circle"},
          {"runner": "macos-15-intel", "target": "darwin-x64", "app": "Circle-darwin-x64/Circle.app", "executable": "Circle-darwin-x64/Circle.app/Contents/MacOS/Circle"},
          {"runner": "windows-2025", "target": "windows-x64", "app": "Circle-win32-x64", "executable": "Circle-win32-x64/Circle.exe"},
          {"runner": "ubuntu-24.04", "target": "linux-x64", "app": "Circle-linux-x64", "executable": "Circle-linux-x64/Circle"}
          ]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/workbench/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/workbench ci
      - run: npm --prefix apps/desktop ci
      - name: Install the WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet tool install --global wix --version 5.0.2
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.UI.wixext/5.0.2
      - run: npm --prefix apps/workbench test
      # Runtime discovery includes the real Electron sandbox guard. Configure
      # its development binary before runtime tests, not only the packaged app.
      - name: Prepare the Linux development display and Chromium sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node -e "console.log(require('./apps/desktop/node_modules/electron'))"
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgtk-3-0 libnss3 libasound2t64
          Xvfb :99 -screen 0 1920x1080x24 > "$RUNNER_TEMP/circle-release-xvfb.log" 2>&1 &
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
          helper="$GITHUB_WORKSPACE/apps/desktop/node_modules/electron/dist/chrome-sandbox"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
      - run: npm --prefix apps/desktop run test:runtime
        # Bound leaked native handles without forcing tests to report success.
        timeout-minutes: 20
      - run: npm --prefix apps/desktop run package
      # Built and installed before the packaged folder is started, so both hold exactly what
      # package wrote
      - name: Build the MSI
        if: runner.os == 'Windows'
        run: npm --prefix apps/desktop run package:msi
      - name: Inspect the compiled MSI
        if: runner.os == 'Windows'
        run: npm --prefix apps/desktop run test:msi
      - name: Install and remove the MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $out = "$env:GITHUB_WORKSPACE\apps\desktop\out"
          $msi = "$out\circle-desktop-$version-windows-x64.msi"
          $packaged = "$out\Circle-win32-x64"
          $installed = "$env:ProgramFiles\Circle"
          $shortcut = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Circle.lnk"
          $data = "$env:APPDATA\Circle"
          $uninstall = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
          function Invoke-Msiexec([string[]] $arguments) {
            $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "msiexec $arguments exited with $($process.ExitCode)" }
          }
          function Get-Entry {
            Get-ItemProperty $uninstall -ErrorAction SilentlyContinue | Where-Object DisplayName -eq 'Circle'
          }
          function Get-Tree([string] $root) {
            Get-ChildItem $root -Recurse -File -Force | ForEach-Object {
              '{0} {1}' -f $_.FullName.Substring($root.Length), (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            }
          }
          if (Test-Path $installed) { throw "$installed exists before installing" }
          # A file in the data folder, which removing the application must leave alone
          $created = -not (Test-Path $data)
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content "$data\msi-smoke.txt" 'kept'

          Invoke-Msiexec @('/i', "`"$msi`"", '/qn', '/l*v', "`"$env:RUNNER_TEMP\msi-install.log`"")
          foreach ($file in 'Circle.exe', 'resources\app.asar') {
            if (-not (Test-Path "$installed\$file")) { throw "$installed\$file is missing" }
          }
          $asar = (Get-FileHash "$installed\resources\app.asar" -Algorithm SHA256).Hash
          if ($asar -ne (Get-FileHash "$packaged\resources\app.asar" -Algorithm SHA256).Hash) {
            throw 'the installed app.asar is not the packaged one'
          }
          $difference = Compare-Object (Get-Tree $packaged) (Get-Tree $installed)
          if ($difference) {
            $difference | Format-Table -AutoSize | Out-String -Width 400 | Write-Host
            throw 'the installed folder differs from the packaged one'
          }
          if (-not (Test-Path $shortcut)) { throw "$shortcut is missing" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
          if ($target -ne "$installed\Circle.exe") { throw "the Start menu entry starts $target" }
          # The link stores its AppUserModelID as UTF-16 text, at any byte offset
          $link = [BitConverter]::ToString([IO.File]::ReadAllBytes($shortcut))
          $id = [BitConverter]::ToString([Text.Encoding]::Unicode.GetBytes('com.qingshanfeihu.circle'))
          if (-not $link.Contains($id)) { throw 'the Start menu entry has no AppUserModelID' }
          $entry = @(Get-Entry)
          if ($entry.Count -ne 1 -or $entry[0].DisplayVersion -ne $version -or $entry[0].Publisher -ne 'qingshanfeihu') {
            $entry | Format-List | Out-String | Write-Host
            throw 'Installed apps does not list Circle once with this version'
          }

          Invoke-Msiexec @('/x', "`"$msi`"", '/qn', '/l*v', "`"$env:RUNNER_TEMP\msi-uninstall.log`"")
          if (Test-Path $installed) { throw "$installed is still there after removing Circle" }
          if (Test-Path $shortcut) { throw "$shortcut is still there after removing Circle" }
          if (Get-Entry) { throw 'Installed apps still lists Circle' }
          if ((Get-Content "$data\msi-smoke.txt") -ne 'kept') { throw 'removing Circle changed its data folder' }
          Remove-Item "$data\msi-smoke.txt"
          if ($created) { Remove-Item $data }
      - name: Run the packaged application
        shell: bash
        run: |
          export CIRCLE_DESKTOP_APP_PATH="$GITHUB_WORKSPACE/apps/desktop/out/${{ matrix.app }}"
          export CIRCLE_DESKTOP_EXECUTABLE="$GITHUB_WORKSPACE/apps/desktop/out/${{ matrix.executable }}"
          run=()
          if [ "$RUNNER_OS" = Linux ]; then
            sysctl kernel.apparmor_restrict_unprivileged_userns || true
            # As a user who only unpacked the archive starts it
            timeout 20 xvfb-run -a "$CIRCLE_DESKTOP_EXECUTABLE" 2>&1 | head -20 || true
            # Chromium's sandbox helper must belong to root and be setuid where unprivileged
            # user namespaces are restricted (Ubuntu 24.04 and later)
            helper="$(dirname "$CIRCLE_DESKTOP_EXECUTABLE")/chrome-sandbox"
            sudo chown root:root "$helper"
            sudo chmod 4755 "$helper"
            run=(xvfb-run -a)
          fi
          "${run[@]}" npm --prefix apps/desktop run test:desktop
          "${run[@]}" npm --prefix apps/desktop run test:live
          # It updates itself to a newer package: the bundle on macOS, the unpacked folder
          # on Linux. The installed MSI's update on Windows runs in the Desktop workbench workflow
          # only: a runner machine that stops answering under it, as some did while Windows
          # Installer used Restart Manager (#45), must not hold a release.
          if [ "$RUNNER_OS" != Windows ]; then
            "${run[@]}" npm --prefix apps/desktop run test:update
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          # Not circle-*: publish takes every circle-* artifact as a release asset
          name: verification-desktop-${{ matrix.target }}
          path: |
            apps/desktop/artifacts/
            outputs/browser-regressions/*metadata.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure() && runner.os == 'Windows'
        with:
          name: circle-desktop-msi-logs
          path: ${{ runner.temp }}/msi-*.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: circle-desktop-${{ matrix.target }}
          path: apps/desktop/out/circle-desktop-*
          if-no-files-found: error
          retention-days: 3

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      # The packages only, not the checks' evidence
      - uses: actions/download-artifact@v7
        with:
          path: dist-release
          pattern: circle-*
          merge-multiple: true
      - name: Checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            test -s "dist-release/circle-$VERSION-$target.tar.gz"
            test -s "dist-release/circle-$VERSION-$target.tar.gz.sha256"
          done
          for target in windows-x64 windows-arm64; do
            test -s "dist-release/circle-$VERSION-$target.zip"
            test -s "dist-release/circle-$VERSION-$target.zip.sha256"
          done
          for asset in darwin-arm64.dmg darwin-x64.dmg windows-x64.msi linux-x64.tar.gz; do
            test -s "dist-release/circle-desktop-$VERSION-$asset"
            test -s "dist-release/circle-desktop-$VERSION-$asset.sha256"
          done
          test "$(ls dist-release | wc -l)" -eq 20
          cp install.sh install.ps1 dist-release/
          cd dist-release
          sha256sum --check circle-*.sha256
          sha256sum circle-*.tar.gz circle-*.zip circle-*.dmg circle-*.msi install.sh install.ps1 > SHA256SUMS
          ls -l
      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            npm run -s release -- --notes "$VERSION"
            echo
            sed -e "s/@VERSION@/${VERSION}/g" -e "s|@REPO@|${GITHUB_REPOSITORY}|g" \
                -e "s|@TAG@|${GITHUB_REF_NAME}|g" .github/release-install.md
          } > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > existing-release.json 2>/dev/null; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("existing-release.json")).isDraft) throw Error("refusing to overwrite a published release")'
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Circle ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist-release/* --clobber
          gh release view "$GITHUB_REF_NAME" --json assets > release-assets.json
          node -e '
            const fs = require("fs");
            const expected = Object.fromEntries(fs.readdirSync("dist-release").map((name) => [name, fs.statSync("dist-release/" + name).size]));
            const actual = Object.fromEntries(JSON.parse(fs.readFileSync("release-assets.json")).assets.map((asset) => [asset.name, asset.size]));
            require("assert").deepStrictEqual(actual, expected);
          '
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file notes.md
