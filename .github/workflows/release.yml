name: runtime-release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            python: '3.13'
            arch: x86_64
          - runner: ubuntu-22.04-arm
            python: '3.13'
            arch: arm64
          - runner: macos-15-intel
            python: '3.13'
            arch: x86_64
          - runner: macos-15
            python: '3.13'
            arch: arm64
          - runner: windows-2025
            python: cpython-3.13.14-windows-x86_64-none
            arch: x86_64
          - runner: windows-11-arm
            python: cpython-3.13.14-windows-x86_64-none
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --frozen --all-extras --python ${{ matrix.python }}
      - run: npm ci --ignore-scripts --prefix circle/node
      - name: Test runtime
        run: uv run --frozen --all-extras pytest -q
        env:
          LANGSMITH_TRACING: 'false'
          LANGCHAIN_TRACING_V2: 'false'
      - name: Build, smoke and relocate artifact
        run: uv run --frozen --all-extras python scripts/build_runtime_release.py --python ${{ matrix.python }} --target-arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.runner }}
          path: dist-release/*
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes artifacts/*
