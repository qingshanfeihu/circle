name: release

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset_os: linux
            asset_arch: x86_64
          - os: macos-15
            asset_os: darwin
            asset_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify version and native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.asset_arch }}
        run: |
          echo "CIRCLE_HOME=${RUNNER_TEMP}/circle-home" >> "$GITHUB_ENV"
          python - <<'PY'
          import os, platform, tomllib
          from pathlib import Path
          from circle import __version__
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert version == __version__, (version, __version__)
          assert platform.machine() == os.environ['EXPECTED_ARCH'], platform.machine()
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == f'v{version}'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'VERSION={version}\n')
          PY

      - name: Install build and test dependencies
        timeout-minutes: 15
        run: |
          python -m venv "$RUNNER_TEMP/circle-build"
          echo "$RUNNER_TEMP/circle-build/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/circle-build/bin/python" -m pip install --upgrade pip setuptools==79.0.1 wheel
          "$RUNNER_TEMP/circle-build/bin/python" -m pip install -e '.[dev]' pyinstaller==6.22.3

      - name: Run the complete test suite
        run: python -m pytest -q

      - name: Build frozen application
        run: |
          pyinstaller packaging/circle.spec --noconfirm --clean
          test -x dist/circle/circle
          test -f dist/circle/_internal/circle/prompts/session/gpt.md
          python scripts/smoke_release.py dist/circle/circle "$VERSION"

      - name: Pack and test installation
        env:
          ASSET_OS: ${{ matrix.asset_os }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('dist/circle/BUILD_INFO.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'], 'version': os.environ['VERSION'],
              'os': os.environ['ASSET_OS'], 'arch': os.environ['ASSET_ARCH']
          }, indent=2) + '\n')
          PY
          ASSET="circle-${ASSET_OS}-${ASSET_ARCH}.tar.gz"
          tar -C dist -czf "$ASSET" circle
          shasum -a 256 "$ASSET" > "${ASSET}.sha256"
          python scripts/smoke_install.py "$ASSET" "$VERSION"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          if-no-files-found: error
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify complete assets and exact source commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/verify_release.py artifacts "$GITHUB_SHA" "${GITHUB_REF_NAME#v}"
          cp install.sh artifacts/install.sh
          (cd artifacts && sha256sum circle-*.tar.gz install.sh > SHA256SUMS)

      - name: Publish only the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > release-notes.txt <<EOF
          Model discovery now uses server-provided IDs, handles empty or failed responses explicitly, and normalizes API paths without changing the host. Setup also supports manual configuration. Checkpoint writes now finish before the next step to prevent stalled multi-step turns.

          Packages: macOS Apple silicon and Linux x86_64 (glibc). Windows, Intel Mac and Linux ARM64 are not included. No updater is included.

          Install (both supported platforms):
          \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/install.sh | CIRCLE_VERSION=${VERSION} bash\`

          Built from ${GITHUB_SHA}. Both platforms passed the complete test suite, frozen startup for both protocols, and archive installation smoke tests. SHA256SUMS is attached for manual verification; install.sh does not verify it automatically. No live StepFun authentication test was performed.
          EOF
          if gh release view "$GITHUB_REF_NAME" --json isDraft > existing-release.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("existing-release.json"))["isDraft"], "release is already published; refusing to overwrite"'
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Circle ${VERSION}" --notes-file release-notes.txt
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          gh release view "$GITHUB_REF_NAME" --json assets > release-assets.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {p.name: p.stat().st_size for p in Path('artifacts').iterdir() if p.is_file()}
          actual = {a['name']: a['size'] for a in json.loads(Path('release-assets.json').read_text())['assets']}
          assert actual == expected, (actual, expected)
          PY
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file release-notes.txt
